name: Certa Server Worker Extension Checks

on:
  push:
    paths:
      - 'server/**'
      - 'bootstrap/Install-CertaServer-FromGitHub.ps1'
      - 'bootstrap/Install-CertaServerWorkerExtension-FromGitHub.ps1'
      - '.github/workflows/certahealth-control-checks.yml'
      - '.github/workflows/certa-server-worker-extension-checks.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'bootstrap/Install-CertaServer-FromGitHub.ps1'
      - 'bootstrap/Install-CertaServerWorkerExtension-FromGitHub.ps1'
      - '.github/workflows/certahealth-control-checks.yml'
      - '.github/workflows/certa-server-worker-extension-checks.yml'
  workflow_dispatch:

jobs:
  worker-extension:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $paths = @(
            'server/worker/Install-CertaServerWorkerExtension.ps1',
            'bootstrap/Install-CertaServerWorkerExtension-FromGitHub.ps1'
          )
          $failures = @()
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path)) {
              $failures += "Missing required file: $path"
              continue
            }
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) {
              $failures += "$($path): $($parseErrors -join '; ')"
            }
          }
          if ($failures.Count) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Verify safe worker boundaries
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath 'server/worker/Install-CertaServerWorkerExtension.ps1' -Raw
          $required = @(
            'Local\CertaServerQueueWorker',
            'Invoke-CertaScriptTask.ps1',
            'Invoke-CertaOllamaTask.ps1',
            'Invoke-CertaQueueWorker.ps1',
            'Start-CertaQueueWorker.ps1',
            'Stop-CertaQueueWorker.ps1',
            'Get-CertaQueueStatus.ps1',
            'QUEUE\codex',
            'QUEUE\specialist',
            'QUEUE\review'
          )
          foreach ($term in $required) {
            if ($source -notmatch [regex]::Escape($term)) {
              throw "Expected worker boundary term missing: $term"
            }
          }
          $forbidden = @(
            "allowParams='true'",
            'codex exec',
            '--dangerously-bypass-approvals-and-sandbox',
            'danger-full-access',
            '--yolo',
            '0.0.0.0:11434'
          )
          foreach ($term in $forbidden) {
            if ($source -match [regex]::Escape($term)) {
              throw "Forbidden worker term found: $term"
            }
          }

      - name: Run base router self-test
        shell: pwsh
        run: |
          & ./server/router/Test-CertaRouter.ps1

      - name: Run queue worker extension self-test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & ./server/worker/Install-CertaServerWorkerExtension.ps1 -SelfTest 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch 'CERTA_SERVER_WORKER_EXTENSION_TEST_PASS') {
            throw 'Worker extension self-test did not emit its pass marker.'
          }
