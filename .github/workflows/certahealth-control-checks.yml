name: CertaHealth Control Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  powershell-and-docs:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) {
              $failures += "$($_.FullName): $($parseErrors -join '; ')"
            }
          }
          if ($failures.Count) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Verify required control files
        shell: pwsh
        run: |
          $required = @(
            'docs/PROJECT_CONNECTION_MATRIX.md',
            'docs/GIT_SITUATION.md',
            'docs/CLOUD_PROCESSING.md',
            'docs/RELEASE_OPS_READINESS.md',
            'docs/RELEASE_LAUNCH_CHECKLIST.md',
            'scripts/Test-CertaProjectProvisioning.ps1',
            'scripts/Set-CertaGitRemotes.ps1',
            'scripts/Manage-CertaLaptopLoad.ps1'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required file: $path"
            }
          }

      - name: Verify launch workspace inventory
        shell: pwsh
        run: |
          $scanRoots = @('docs', 'scripts')
          $requiredTerms = @(
            'CERTASURV_WEB_APP',
            'MACROTBC',
            'WV_COURTHOUSE_RESEARCHER'
          )
          $forbiddenTerms = @(
            ('New' + ' project2')
          )

          $files = Get-ChildItem -Path $scanRoots -Recurse -File | Where-Object {
            $_.Extension -in '.md', '.ps1'
          }
          $content = ($files | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join "`n"

          foreach ($term in $requiredTerms) {
            if ($content -notmatch [regex]::Escape($term)) {
              throw "Missing launch workspace reference: $term"
            }
          }

          foreach ($term in $forbiddenTerms) {
            if ($content -match [regex]::Escape($term)) {
              throw "Forbidden legacy workspace reference found: $term"
            }
          }
