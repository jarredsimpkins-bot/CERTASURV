name: CertaHealth Control Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  powershell-and-docs:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) {
              $failures += "$($_.FullName): $($parseErrors -join '; ')"
            }
          }
          if ($failures.Count) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Validate JSON control files
        shell: pwsh
        run: |
          $jsonFiles = @(
            'server/policies/task-routing-policy.json',
            'server/schemas/task.schema.json'
          )
          foreach ($path in $jsonFiles) {
            $null = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          }

      - name: Verify required control files
        shell: pwsh
        run: |
          $required = @(
            'docs/PROJECT_CONNECTION_MATRIX.md',
            'docs/GIT_SITUATION.md',
            'docs/CLOUD_PROCESSING.md',
            'docs/RELEASE_OPS_READINESS.md',
            'docs/RELEASE_LAUNCH_CHECKLIST.md',
            'scripts/Test-CertaProjectProvisioning.ps1',
            'scripts/Set-CertaGitRemotes.ps1',
            'scripts/Manage-CertaLaptopLoad.ps1',
            'server/Install-CertaServer.ps1',
            'server/router/New-CertaTask.ps1',
            'server/router/Invoke-CertaRouter.ps1',
            'server/router/Invoke-CertaOllamaTask.ps1',
            'server/router/Get-CertaServerHealth.ps1',
            'server/router/Test-CertaRouter.ps1',
            'server/router/Test-CertaTaskRecord.ps1',
            'server/trigger/Install-CertaServer-TriggerCommands.ps1',
            'server/capabilities/New-CertaFileManifest.ps1',
            'server/capabilities/Test-CertaFileManifest.ps1',
            'server/capabilities/Update-CertaCapabilityRegistry.ps1',
            'bootstrap/Install-CertaServer-FromGitHub.ps1'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required file: $path"
            }
          }

      - name: Run Certa server router self-test
        shell: pwsh
        run: |
          & ./server/router/Test-CertaRouter.ps1

      - name: Test legacy capability registry recovery
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP ('certa-registry-test-' + [guid]::NewGuid().ToString('N'))
          $registryDirectory = Join-Path $testRoot 'CONTROL\registries'
          New-Item -ItemType Directory -Path $registryDirectory -Force | Out-Null
          $registryPath = Join-Path $registryDirectory 'CAPABILITY_REGISTRY.csv'

          @'
          "legacy_name","status"
          "old-row","UNKNOWN"
          '@ | Set-Content -LiteralPath $registryPath -Encoding UTF8

          $result = & ./server/capabilities/Update-CertaCapabilityRegistry.ps1 -ServerRoot $testRoot
          if ($result.status -ne 'PASS') { throw 'Registry recovery did not pass.' }
          if ($result.dropped_invalid_rows -ne 1) { throw 'Malformed legacy row was not reported.' }
          if (-not (Test-Path -LiteralPath $result.backup_path)) { throw 'Legacy registry backup was not created.' }

          $rows = @(Import-Csv -LiteralPath $registryPath)
          $manifestRows = @($rows | Where-Object { $_.capability_id -eq 'file-manifest-v1' })
          if ($manifestRows.Count -ne 1) { throw 'Recovered registry is missing file-manifest-v1.' }

          @'
          "capability_id","name","status"
          "legacy-valid","Legacy capability","VERIFIED"
          '@ | Set-Content -LiteralPath $registryPath -Encoding UTF8

          $null = & ./server/capabilities/Update-CertaCapabilityRegistry.ps1 -ServerRoot $testRoot
          $rows = @(Import-Csv -LiteralPath $registryPath)
          if (@($rows | Where-Object { $_.capability_id -eq 'legacy-valid' }).Count -ne 1) {
            throw 'Valid legacy capability was not retained.'
          }
          if (@($rows | Where-Object { $_.capability_id -eq 'file-manifest-v1' }).Count -ne 1) {
            throw 'Manifest capability was not written exactly once.'
          }
