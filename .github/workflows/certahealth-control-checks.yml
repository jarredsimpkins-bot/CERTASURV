name: CertaHealth Control Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  powershell-and-docs:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) {
              $failures += "$($_.FullName): $($parseErrors -join '; ')"
            }
          }
          if ($failures.Count) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Verify required control files
        shell: pwsh
        run: |
          $required = @(
            'docs/PROJECT_CONNECTION_MATRIX.md',
            'docs/GIT_SITUATION.md',
            'docs/CLOUD_PROCESSING.md',
            'docs/RELEASE_OPS_READINESS.md',
            'docs/RELEASE_LAUNCH_CHECKLIST.md',
            'scripts/Test-CertaProjectProvisioning.ps1',
            'scripts/Set-CertaGitRemotes.ps1',
            'scripts/Manage-CertaLaptopLoad.ps1'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required file: $path"
            }
          }

      - name: Guard launch workspace paths
        shell: pwsh
        run: |
          $scriptRefs = Get-ChildItem scripts -Filter *.ps1 -Recurse | Select-String -Pattern 'New project2' -List
          if ($scriptRefs) {
            $scriptRefs | ForEach-Object { Write-Error "Legacy web app path reference in $($_.Path):$($_.LineNumber)" }
            exit 1
          }

          $requiredRefs = @(
            @{ Pattern = 'CERTASURV_WEB_APP'; Scope = 'scripts/*.ps1' },
            @{ Pattern = 'WV_COURTHOUSE_RESEARCHER'; Scope = 'scripts/*.ps1' }
          )
          foreach ($ref in $requiredRefs) {
            $found = Get-ChildItem scripts -Filter *.ps1 -Recurse | Select-String -Pattern $ref.Pattern -Quiet
            if (-not $found) {
              throw "Missing launch workspace reference '$($ref.Pattern)' in $($ref.Scope)"
            }
          }
