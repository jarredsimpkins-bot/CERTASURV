name: CertaHealth Control Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  powershell-and-docs:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) {
              $failures += "$($_.FullName): $($parseErrors -join '; ')"
            }
          }
          if ($failures.Count) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Verify required control files
        shell: pwsh
        run: |
          $required = @(
            'docs/PROJECT_CONNECTION_MATRIX.md',
            'docs/GIT_SITUATION.md',
            'docs/CLOUD_PROCESSING.md',
            'docs/RELEASE_OPS_READINESS.md',
            'docs/RELEASE_LAUNCH_CHECKLIST.md',
            'scripts/Test-CertaProjectProvisioning.ps1',
            'scripts/Set-CertaGitRemotes.ps1',
            'scripts/Manage-CertaLaptopLoad.ps1'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required file: $path"
            }
          }

      - name: Guard launch doc remote alignment
        shell: pwsh
        run: |
          $matrixPath = 'docs/PROJECT_CONNECTION_MATRIX.md'
          $gitSituationPath = 'docs/GIT_SITUATION.md'
          $matrix = Get-Content -Raw $matrixPath
          $gitSituation = Get-Content -Raw $gitSituationPath

          if ($matrix -match 'CERTARD.+needs Git remote') {
            throw "Stale CERTARD remote status found in $matrixPath"
          }

          $expectedCertardRemote = 'https://github.com/jarredsimpkins-bot/certard.git'
          if ($matrix -notmatch [regex]::Escape($expectedCertardRemote)) {
            throw "Missing CERTARD origin reference in $matrixPath"
          }

          if ($gitSituation -notmatch [regex]::Escape($expectedCertardRemote)) {
            throw "Missing CERTARD origin reference in $gitSituationPath"
          }
