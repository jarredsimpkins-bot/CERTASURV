name: CertaHealth Control Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  powershell-and-docs:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) {
              $failures += "$($_.FullName): $($parseErrors -join '; ')"
            }
          }
          if ($failures.Count) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Verify required control files
        shell: pwsh
        run: |
          $required = @(
            'docs/PROJECT_CONNECTION_MATRIX.md',
            'docs/GIT_SITUATION.md',
            'docs/CLOUD_PROCESSING.md',
            'docs/RELEASE_OPS_READINESS.md',
            'docs/RELEASE_LAUNCH_CHECKLIST.md',
            'scripts/Test-CertaProjectProvisioning.ps1',
            'scripts/Set-CertaGitRemotes.ps1',
            'scripts/Manage-CertaLaptopLoad.ps1'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required file: $path"
            }
          }

      - name: Verify launch workspace inventory
        shell: pwsh
        run: |
          $scriptRefs = Get-ChildItem -Path scripts -Filter *.ps1 -Recurse |
            Select-String -SimpleMatch 'New project2'
          if ($scriptRefs) {
            $scriptRefs | ForEach-Object { Write-Error $_ }
            throw 'Legacy New project2 fallback references are not allowed in release-control scripts.'
          }

          $requiredRefs = @(
            @{ Path = 'scripts/Test-CertaProjectProvisioning.ps1'; Text = 'CERTASURV_WEB_APP' },
            @{ Path = 'scripts/Test-CertaProjectProvisioning.ps1'; Text = 'WV_COURTHOUSE_RESEARCHER' },
            @{ Path = 'scripts/Set-CertaGitRemotes.ps1'; Text = 'WV_COURTHOUSE_RESEARCHER' },
            @{ Path = 'scripts/Invoke-CertaCloudOffload.ps1'; Text = 'WV_COURTHOUSE_RESEARCHER' },
            @{ Path = 'docs/PROJECT_CONNECTION_MATRIX.md'; Text = 'WV_COURTHOUSE_RESEARCHER' }
          )
          foreach ($ref in $requiredRefs) {
            $content = Get-Content -Raw -LiteralPath $ref.Path
            if ($content -notlike "*$($ref.Text)*") {
              throw "Missing required launch inventory reference '$($ref.Text)' in $($ref.Path)"
            }
          }
