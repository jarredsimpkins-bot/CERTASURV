name: Build CAD conversion utility
on:
  push:
    branches: [hamlin-dwg-r1-20260913]
    paths: [.github/workflows/cad-conversion-tool.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve official converter; no user drawings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          curl --fail --location --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 120 'https://www.opendesign.com/guestfiles/get?filename=ODAFileConverter_QT6_lnxX64_8.3dll_27.1.AppImage' -o result/ODAFileConverter.AppImage
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('result/ODAFileConverter.AppImage'); b=p.read_bytes()
          assert b[:4]==b'\x7fELF' and 1000000<len(b)<200000000
          pathlib.Path('result/source-receipt.json').write_text(json.dumps({'source':'Official Open Design Alliance guestfiles download','version':'27.1','bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'user_project_data':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-cad-converter-tool
          path: result/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
